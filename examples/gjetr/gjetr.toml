# gjetr Config. gjetr reads this file and never writes it. Changes apply live.
# Copy to ~/.config/gjetr/gjetr.toml.
#
# A mistyped value falls back to its default, and a file that does not parse
# falls back as a whole. Errors are logged with the file, line and key:
#   journalctl --user -f | grep gjetr
#   omarchy-shell nytafar.gjetr state

# herdr's API socket.
# socket = "~/.config/herdr/herdr.sock"

[[display]]
# The output to draw on, as `hyprctl monitors` names it.
name = "HDMI-A-2"

# The Deck: Layouts to tab through, in order. Each is layouts/<name>.toml.
# With more than one, tabs appear on a short edge (opposite the bar) and a
# sideways swipe moves between them. The chosen Layout is kept as an Override.
deck = ["agents"]

# May gjetr rotate this output to match the active Layout's orientation?
# It rotates at runtime with hyprctl and never edits monitors.lua; the next
# `hyprctl reload` resets the output and gjetr applies the rotation again.
# When false, Layouts built for the other orientation are skipped (all are
# kept if none fits).
rotatable = false

# Touchscreens that turn with this Display, as `hyprctl devices` names them.
# Hyprland does not rotate touch input with a runtime output transform, so
# gjetr sets the same transform on these devices. Leave it empty to set the
# global input.touchdevice.transform instead, which covers every touchscreen
# without a transform of its own.
# touch_devices = ["wch.cn-usb2iic_ctp_control", "wch.cn-usb2iic_ctp_control-1"]

# "black", "theme" (the Omarchy theme background), "wallpaper" (the Omarchy
# wallpaper shows through), "transparent" (same as wallpaper), or a colour:
# "#rrggbb", or "#aarrggbb" to tint the wallpaper, e.g. "#c0000000".
background = "black"

# Seconds between usage refreshes for Usage Modules on this Display, 60 to
# 86400 (default 900). A Usage Module's own refresh_seconds wins.
# refresh_seconds = 900

# A Dock: a Display along one edge of an output, beside your windows. It stays
# on every workspace, windows tile beside it (it reserves its strip), ordinary
# windows never cover it, and it never takes keyboard focus. It has its own
# Deck. Show or hide it with a keybinding (docs/CONFIGURATION.md, "Docks"):
#   omarchy-shell nytafar.gjetr toggleDock DP-1
#
# [[display]]
# kind = "dock"             # "surface" (default, the whole output) or "dock"
# name = "DP-1"             # the output; one Display per output
# edge = "left"             # "left" (default), "right", "top" or "bottom"
# size = 360                # logical px: width of a left/right Dock, height of
#                           # a top/bottom one; 120 to 2000, at most half the output
# visible = true            # shown at start; toggleDock keeps its choice as an Override
# deck = ["dock"]           # layouts/dock.toml: Agents over usage, portrait
# background = "theme"
