# A Layout: the Modules on a Display and the orientation they are built for.
# The file name (agents) is the name a Deck uses.

# "portrait", "landscape" or "any". On a rotatable Display, selecting this
# Layout turns the output to match; "any" leaves the output as it is.
orientation = "portrait"

# Every [[module]] is drawn, in order: side by side on a landscape Display,
# stacked on a portrait one. Each has its own settings and Overrides.
[[module]]
type = "agent-list"

# Share of the width (landscape) or height (portrait) beside other Modules.
# weight = 1

# Default Sort mode: "spaces" (herdr's workspace, tab and pane order) or
# "priority" (herdr's attention queue: blocked, done, working, idle, most
# recent change first), both as in herdr's own agent panel; or "cache"
# (soonest-expiring Cache timer first, then cold ones, then Agents without a
# timer). Tapping the list header cycles it as an Override, which is kept
# until reset.
sort = "spaces"

# Card preset: "detailed" (status, kind, name, workspace › tab, Cache timer)
# or "compact" (the same without workspace › tab).
preset = "detailed"

# Focus on tap: "herdr" focuses the pane in herdr. "window" also switches to
# the most recently focused terminal window running a herdr client of this
# server, and focuses it. Tapping "focus" in the list header flips it as an
# Override.
focus = "herdr"

# Recap: the latest session recap Claude Code wrote for a Claude Agent
# (away_summary in ~/.claude/projects/<project>/<session>.jsonl, found by the
# session id herdr reports). "off", "inline" (two lines on the Card) or
# "expand" (a "recap" area on the Card, or a long press, shows it in full).
recap = "off"

# With recap = "expand", where the full Recap opens: "card" (under the Card's
# Fields; the Card grows, and a tap on the Recap closes it; several can be open)
# or "overlay" (over the whole list; a tap closes it).
recap_open = "card"

# Cards of Agents in herdr's focused workspace get a subtle tint. The list is
# never filtered. true (default) or false.
highlight_workspace = true

# How a Card shows status: "glyph" (default: the glyph beside the kind mark),
# "icon" (the kind mark itself in the status colour: moving while working,
# dim when idle, flashing when blocked, green and pulsing when done until seen;
# the glyph goes, the status word stays) or "both".
indicator = "glyph"

# How a working kind mark moves with "icon" or "both": "sweep" (a slow accent
# gradient, default), "breathe" (brightness and a soft glow, about 1.5 s),
# "hue" (cycles the theme's colours) or "shimmer" (a highlight every 2 s).
working_effect = "sweep"
