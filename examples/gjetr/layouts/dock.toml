# Dock, portrait: Agents on top, usage pinned underneath, for a Dock along the
# left or right edge of a main monitor. Use it as the deck of a kind = "dock"
# Display in gjetr.toml (see the commented Dock there).
#
# A left or right Dock is portrait and a top or bottom Dock landscape, from its
# shape; a Dock never rotates its output. Modules stack in portrait.

orientation = "portrait"

# The Agent List takes all the height the usage lines leave.
[[module]]
type = "agent-list"
sort = "priority"
# compact leaves out workspace › tab and the status word.
preset = "compact"
# A Dock draws compact rows by default (density = "auto" follows the mouse and
# the width). "full" draws larger Cards to read leaning back: name, status
# word, repository and branch, a draining Cache timer bar and two Recap lines.
# density = "full"
focus = "window"
# Inline Recaps grow only the Cards that have one.
recap = "inline"

# Rate limits, pinned to the bottom: exactly as tall as their lines (at most
# half the Dock), growing when a provider or limit appears. Without pin the
# two Modules would split the height by weight.
[[module]]
type = "usage"
pin = "end"
show = ["limits"]
